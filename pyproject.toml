[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fsglib"
version = "0.1.0"
description = "Fine Star Guiding Library for ET algorithm verification"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
