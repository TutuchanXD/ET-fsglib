project:
  name: fsglib_microlens_guide_v1_noise_psf

guide_init:
  dataset_root: /home/cxgao/Results/FSG_guide_sims_legacy_20260508/microlens_guide_photsim7_6s
  frame_index: 0
  max_observed_per_detector: 100
  los_geometry_mode: exact_et_focalplane
  body_model_fit_grid_size: 13
  body_model_initial_f_mm: 5150.0
  catalog_g_mag_max: 16.0
  reference_topk_per_detector: 260
  target_epoch: 2000.0
  detector_batches:
    - detector_id: guide_top
      batch_name: batch0_guide_top_ra269.0166_dec-28.1059
    - detector_id: guide_left
      batch_name: batch1_guide_left_ra267.6978_dec-29.4943
    - detector_id: guide_bottom
      batch_name: batch2_guide_bottom_ra269.3037_dec-30.6484
    - detector_id: guide_right
      batch_name: batch3_guide_right_ra270.6153_dec-29.2442

detector:
  image_height: 2049
  image_width: 2049
  pixel_size_um: 6.5

et_coord:
  src_dir: /home/cxgao/ET/et_focalplane/src
  data_dir: /home/cxgao/ET/et_focalplane/data_microlens
  config_factory: microlens_guide_only
  gaia_root_dir: /home/cxgao/gaia_dr3_19mag

match:
  algorithm: predicted_position_and_local_pyramid
  mode: init
  init_max_catalog_radius_deg: 1.5
  init_bright_star_topk: 20
  pair_angle_tol_arcsec: 120.0
  hypothesis_topk: 50
  validate_max_residual_arcsec: 60.0
  validate_max_residual_pix: 10.0
  validate_min_support: 5
  enforce_unique_assignment: true
  local_pyramid:
    enabled: false
    max_observed_stars: 40
    max_reference_stars: 300
    seed_scopes: ["single_detector", "mixed_detector"]
    pair_angle_tol_arcsec_single_detector: 120.0
    pair_angle_tol_arcsec_mixed_detector: 300.0
    seed_rms_gate_arcsec: 60.0
    seed_max_gate_arcsec: 180.0
    expand_angular_gate_arcsec: 120.0
    expand_pixel_gate_pix: 10.0
    min_expanded_matches: 5

attitude:
  outlier_reject_enable: true
  outlier_max_residual_arcsec: 30.0

evaluation:
  guide_error_audit:
    enabled: true
    truth_match_radius_pix: 3.0
