project:
  name: fsglib
  mode: init
  save_debug: true
  output_dir: outputs/debug

io:
  npz_image_key: images
  npz_time_key: time_s
  npz_variant_key: variant_ids
  npz_cadence_key: cadence_s
  npz_unit_key: unit

dataset:
  truth_origin: centered_pixels
  truth_y_axis_up: false

detector:
  num_detectors: 4
  image_height: 2049
  image_width: 2049
  pixel_size_um: 6.5
  adc_bit_depth: 12
  adc_min_value: 0.0
  saturation_value: 4095.0
  bad_pixel_map: null

psf:
  active_model_key: null
  template_bundle_path: null

preprocess:
  enable_bias_subtraction: true
  bias_frame_path: /home/cxgao/ET/FSG/fsglib-data/calibration/pr09_fake/2049x2049/bias_frame.npz
  enable_dark_subtraction: true
  dark_current_path: /home/cxgao/ET/FSG/fsglib-data/calibration/pr09_fake/2049x2049/dark_current_per_s.npz
  enable_flat_field: true
  flat_field_path: /home/cxgao/ET/FSG/fsglib-data/calibration/pr09_fake/2049x2049/flat_field.npz
  enable_bad_pixel_mask: true
  bad_pixel_mask_path: /home/cxgao/ET/FSG/fsglib-data/calibration/pr09_fake/2049x2049/bad_pixel_mask.npz
  enable_fpn_subtraction: true
  fpn_residual_map_path: /home/cxgao/ET/FSG/fsglib-data/calibration/pr09_fake/2049x2049/fpn_residual_map.npz
  enable_adc_clip: true
  enable_saturation_guard: true
  saturation_mask_dilation_pix: 0
  enable_background_subtraction: true
  background_method: sigma_clip_global
  sigma_clip_k: 3.0
  sigma_clip_max_iters: 3
  background_mesh_size: 64
  variance_model: empirical_robust
  gain_e_per_dn: null
  read_noise_e: null
  quantization_noise_e: 0.0
  dark_current_e_per_s: null
  denoise_method: none

extract:
  detection_image: snr
  seed_threshold_sigma: 5.0
  grow_threshold_sigma: 3.0
  min_area: 3
  max_area: 200
  centroid_method: weighted_centroid
  centroid_window:
    center: peak
    size: 31
  bbox_expand: 2
  reject_edge_margin: 3
  max_ellipticity: 0.8
  reject_degenerate_sources: true
  min_fwhm_pix: null
  max_sharpness: 10.0
  reject_artifact_mask_overlap: true
  artifact_mask_margin_pix: 2
  centroid_covariance:
    min_sigma_pix: 0.03
    jacobian_step_pix: 0.01
  deblend:
    enabled: true
    policy: flag_only
    peak_threshold_sigma: null

match:
  algorithm: "predicted_position"
  mode: init
  init_max_catalog_radius_deg: 1.5
  init_bright_star_topk: 20
  pair_angle_tol_arcsec: 120.0
  hypothesis_topk: 50
  validate_max_residual_arcsec: 60.0
  validate_max_residual_pix: 25.0
  validate_min_support: 5
  enforce_unique_assignment: true
  local_pyramid:
    enabled: false
    max_observed_stars: 40
    max_reference_stars: 300
    seed_scopes: ["single_detector", "mixed_detector"]
    pair_angle_tol_arcsec_single_detector: 120.0
    pair_angle_tol_arcsec_mixed_detector: 300.0
    seed_rms_gate_arcsec: 60.0
    seed_max_gate_arcsec: 180.0
    expansion_policy: predicted_xy
    geometry_only_allowed: false
    reacquire_expansion_policy: seed_attitude_only
    reacquire_geometry_only_allowed: true
    expand_angular_gate_arcsec: 120.0
    expand_pixel_gate_pix: 25.0
    min_expanded_matches: 5
    ambiguity_min_score_margin: 1.0
    detector_mean_warn_pix: 5.0
    detector_mean_reject_pix: 25.0
    detector_rms_reject_pix: 25.0
    detector_max_reject_pix: 50.0
    mixed_detector_reject_on_detector_warning: true
    photometric_rank_weight: 0.0
    seed_consistency_penalty: 1.0e-6

tracking:
  search_radius_pix: 10.0
  max_miss_count: 3
  tracking_match_algorithm: "predicted_position"
  local_reacquire_match_algorithm: "predicted_position_with_pyramid_reacquire"
  lost_in_space_match_algorithm: "lost_in_space"
  reacquire_after_tracking_failures: 2
  lost_in_space_after_reacquire_failures: 3
  safe_lost_after_lis_failures: 1
  reacquire_after_failures: 2
  lost_after_init_failures: 3
  max_attitude_jump_arcsec: 300.0

ephemeris:
  catalog_backend: "healpix"
  gaia_root_dir: "/home/cxgao/gaia_dr3_19mag"
  mag_limit: 15.0
  gaia_partition_cache_size: 8
  missing_partition_policy: ignore
  tracking_catalog_radius_deg: 2.0
  reference_selection_mode: "visible_only"
  reference_topk: 0
  gaia_to_kp_poly_path: "/home/cxgao/ET/Photsim7-data/misc/gaia2kp_mag_pfc.npy"
  target_epoch: 2000.0
  reference_epoch_default: 2016.0
  enable_proper_motion: true
  enable_precession: false
  enable_nutation: false
  enable_dva: false
  enable_relativity: false

attitude:
  solver: quest
  min_stars_mathematical: 2
  min_stars_operational: 4
  weight_mode: variance_snr_hybrid
  estimate_covariance: true
  covariance_rank_tol: 1.0e-12
  outlier_reject_enable: true
  outlier_reject_mode: sigma_clip_iterative
  outlier_max_residual_arcsec: 30.0
  outlier_sigma_clip: 3.0
  outlier_use_measurement_sigma: true
  outlier_sigma_floor_arcsec: 2.0
  outlier_mad_fallback_enable: true
  outlier_mad_min_sigma_arcsec: 1.0e-6
  outlier_max_reject_per_iteration: 1
  min_active_detectors_valid: null
  max_iterations: 5

metrics:
  enable_truth_compare: true
  report_centroid_error: true
  report_attitude_error: true
  report_runtime: true

evaluation:
  batch_glob: "batch*"
  frame_stride: 1
  max_frames_per_batch: null
  error_budget:
    enabled: true
    output_json: true
    output_csv: true
    max_per_star_records: null
    catalog_uncertainty_arcsec: null
    optical_alignment_residual_arcsec: null
    aggregate_percentiles: [50, 95, 99]
  centroid_step_audit:
    enabled: false
    stamp_size: 31
    truth_match_radius_pix: 3.0
    max_stars: null
    ft_root: "/home/cxgao/ET/Photsim7"
    data_dir: "/home/cxgao/ET/Photsim7-data"
    config_xlsx: "/home/cxgao/ET/FSG/fsgsim/config/et_100_det_inputs_1h.xlsx"
    psf_field_id: 6
    mag_type: "ET"

logging:
  level: INFO
  save_intermediate_arrays: true
  save_source_catalog: true
  save_match_result: true
